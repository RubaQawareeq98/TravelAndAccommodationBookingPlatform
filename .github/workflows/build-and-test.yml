name: build and test

on:
  push:
    branches:
      - main
      - unit-tests
    paths:
      - '**.cs'
      - '**.csproj'
  pull_request:
    branches:
      - main
      - test
    paths:
      - '**.cs'
      - '**.csproj'

env:
  DOTNET_VERSION: '8.0.x' # The .NET SDK version to use

jobs:
  build-and-test:
    name: build-and-test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest] 

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Install dotCover Global Tool
      run: dotnet tool install --global JetBrains.dotCover.GlobalTool

    - name: Run tests with dotCover coverage
      run: |
        $Env:PATH += ";$Env:USERPROFILE\.dotnet\tools"
        dotCover analyse `
          /TargetExecutable=dotnet `
          /TargetArguments="test --no-build --no-restore --configuration Release" `
          /Output=coverage.dcvr

    - name: Generate HTML coverage report
      run: dotCover report /Source=coverage.dcvr /Output=coverage-report.html /ReportType=HTML

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v3
      with:
        name: dotCover-Coverage-Report
        path: coverage-report.html
