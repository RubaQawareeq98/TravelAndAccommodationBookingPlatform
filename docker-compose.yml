services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - env/sqlServer.env
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -x 'sqlservr' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s